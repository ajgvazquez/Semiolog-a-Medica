  let sistemaActualIndex = 0;

  function renderSistemas() {
    const sysNav = document.getElementById('systemNav');
    sysNav.innerHTML = datosSistemas.map((sys, idx) => 
      `<button onclick="selectSistema(${idx})" class="system-btn ${idx === sistemaActualIndex ? 'active' : ''}">${sys.sistema}</button>`
    ).join('');
    renderSubNav(sistemaActualIndex, 0);
  }

  function selectSistema(sysIdx) {
    sistemaActualIndex = sysIdx;
    document.querySelectorAll('.system-btn').forEach((btn, idx) => {
      if(idx === sysIdx) btn.classList.add('active');
      else btn.classList.remove('active');
    });
    renderSubNav(sysIdx, 0);
  }

  function renderSubNav(sysIdx, sindromeIdx) {
    const subNav = document.getElementById('subNav');
    const sindromes = datosSistemas[sysIdx].sindromes;
    subNav.innerHTML = sindromes.map((s, idx) => 
      `<button onclick="loadSindrome(${sysIdx}, ${idx})" class="${idx === sindromeIdx ? 'active' : ''}">${s.titulo}</button>`
    ).join('');
    loadSindrome(sysIdx, sindromeIdx);
  }

  function loadSindrome(sysIdx, sindromeIdx) {
    const buttons = document.querySelectorAll('#subNav button');
    buttons.forEach((btn, idx) => {
      if(idx === sindromeIdx) btn.classList.add('active');
      else btn.classList.remove('active');
    });

    const s = datosSistemas[sysIdx].sindromes[sindromeIdx];
    const nombreSistema = datosSistemas[sysIdx].sistema;
    const content = document.getElementById('moduleContent');
    
    content.innerHTML = `
      <div class="card">
        <small style="color: var(--secondary); font-weight: bold; text-transform: uppercase;">${nombreSistema}</small>
        <h2>${s.titulo}</h2>
        <p><strong>Fisiopatología:</strong> ${s.fisiopatologia}</p>
        
        <div class="ref-box">
          <h4>📚 Referencias Cruzadas & Láminas Ilustrativas</h4>
          <p style="margin: 0 0 0.5rem 0;"><strong>Enfoque Netter:</strong> ${s.netterRef}</p>
          <p style="margin: 0;"><strong>Maniobra / Descripción Califano:</strong> ${s.califanoRef}</p>
        </div>

        <div class="image-grid">
          <div class="image-box">
            <strong>Ilustración Tratado Netter</strong>
            <img src="${s.netterImg}" alt="Esquema Netter">
          </div>
          <div class="image-box">
            <strong>Esquema Maniobra Barré-Califano</strong>
            <img src="${s.califanoImg}" alt="Esquema Califano">
          </div>
        </div>
      </div>
      
      <div class="card">
        <h3>Examen Físico y Hallazgos Semiológicos</h3>
        <div class="grid">
          <div class="grid-item"><strong>Inspección:</strong> ${s.hallazgos.inspeccion}</div>
          <div class="grid-item"><strong>Palpación:</strong> ${s.hallazgos.palpacion}</div>
          <div class="grid-item"><strong>Percusión:</strong> ${s.hallazgos.percusion}</div>
          <div class="grid-item"><strong>Auscultación:</strong> ${s.hallazgos.auscultacion}</div>
        </div>
      </div>
    `;
  }

  renderSistemas();
</script>
